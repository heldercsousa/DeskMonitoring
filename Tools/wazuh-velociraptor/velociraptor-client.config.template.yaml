# Velociraptor CLIENT config TEMPLATE - PRE-AUTHORED for T084 (deploy on clean rebuild).
#
# This is a TEMPLATE, not a working config. You cannot fill the real values until the
# Velociraptor SERVER exists on the N100, because the client must trust the server's
# self-signed CA and know its public address. After running the server setup wizard
# (see Tools/wazuh-velociraptor/README.md), the wizard EMITS a real client.config.yaml -
# prefer that generated file. Keep this template only as a documented reference of the
# fields that matter for this ecosystem.
#
# Replace every <PLACEHOLDER> below.

Client:
  server_urls:
    # The N100's reachable address. Use the LAN IP for an isolated deployment, or a
    # frps/Tailscale endpoint if the sensor is off-LAN. Port 8000 is the Velociraptor default.
    - https://<N100_IP_OR_HOSTNAME>:8000/

  # Pin the server CA so a man-in-the-middle (the on-host attacker) cannot impersonate
  # the manager. Copy this from the server config's Client.ca_certificate after setup.
  ca_certificate: |
    -----BEGIN CERTIFICATE-----
    <PASTE_SERVER_CA_CERT_PEM_HERE>
    -----END CERTIFICATE-----

  # Nonce + writeback path are generated by the server wizard; do not invent them.
  nonce: <SERVER_GENERATED_NONCE>

  # Where the client stores its enrollment identity on the endpoint.
  writeback_windows: $ProgramFiles\Velociraptor\velociraptor.writeback.yaml

  # Reconnect quickly so a hunt reaches the endpoint fast.
  max_poll: 60

  # Local buffer survives the agent being killed/restarted (attacker tamper resilience).
  local_buffer:
    memory_size: 52428800        # 50 MB
    disk_size: 1073741824        # 1 GB
    filename_windows: $TEMP\VelociraptorBuffer.bin

# The label below auto-applies to this endpoint so server-side hunts can target it.
Frontend:
  # informational only on the client; the real value lives in server.config.yaml
  hostname: <N100_IP_OR_HOSTNAME>

# Logging - keep verbose enough to investigate agent tampering.
Logging:
  output_directory: $ProgramFiles\Velociraptor\Logs
  separate_logs_per_component: true
  rotation_time: 604800          # 7 days
  max_age: 2592000               # 30 days
