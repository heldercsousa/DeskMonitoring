<!--
  Wazuh Windows agent config - PRE-AUTHORED for T084 (deploy on clean rebuild).
  Tailored to the C:\Sync FolderSync + camera ecosystem threat model.

  Deploy: copy to  C:\Program Files (x86)\ossec-agent\ossec.conf  on the laptop
  AFTER the clean rebuild, then set <client><server><address> to the N100's IP and
  register the agent (see Tools/wazuh-velociraptor/README.md).

  FIM and registry targets below mirror the EXACT surfaces this attacker tampers:
    - Config scripts overwritten nightly (cloud_sync.ps1, run_mirror.bat, auditor.ps1,
      setup_update.ps1) -> syscheck on C:\Sync\Config with report_changes.
    - hosts-file poisoning of api.backblazeb2.com -> syscheck on the hosts file.
    - Defensive scheduled tasks disabled in-process (T070) -> syscheck on the Tasks dir.
    - Power/USB/sleep registry keys flipped (T058/T067/T069) -> registry syscheck.
    - HKCU Run-key persistence (T017) -> registry syscheck.
-->
<ossec_config>

  <client>
    <!-- ACTION FOR HELDER: set to the N100 Wazuh manager IP after it is built -->
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows11</config-profile>
    <notify_time>30</notify_time>
    <time-reconnect>120</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- ============================== FILE INTEGRITY ============================== -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Real-time so a nightly overwrite alerts within seconds, not at next scan -->
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- The hot zone: every defensive script lives here and is overwritten nightly.
         report_changes ships the actual diff off-box; check_all hashes + perms. -->
    <directories check_all="yes" report_changes="yes" realtime="yes" whodata="yes">C:\Sync\Config</directories>

    <!-- Forensic + evidence trees: must never be silently altered -->
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\Sync\Evidence</directories>

    <!-- DNS/hosts poisoning of api.backblazeb2.com -->
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>

    <!-- Scheduled-task definitions: in-process disable/delete of FolderSync-* tasks -->
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\Windows\System32\Tasks</directories>

    <!-- Common persistence/startup locations -->
    <directories check_all="yes" realtime="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp</directories>

    <!-- Noise control: Wazuh ships its own logs; the ecosystem rotates its own.
         We watch Config scripts (above) but ignore the high-churn state/log files. -->
    <ignore>C:\Sync\Config\.ecosystem_state</ignore>
    <ignore>C:\Sync\Config\.camera_paused</ignore>
    <ignore>C:\Sync\Config\.sync_failed</ignore>
    <ignore>C:\Sync\Config\.camera_restart_failed</ignore>
    <ignore type="sregex">\.log$</ignore>
    <ignore type="sregex">\.tmp$</ignore>

    <!-- ===================== WINDOWS REGISTRY MONITORING ===================== -->
    <!-- Power / USB-selective-suspend / sleep keys the attacker flips to stop the
         camera (T058 webcam power, T067 power-button sleep, T069 unattended sleep). -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Power</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\USB</windows_registry>

    <!-- Run-key persistence (T017 whitelist: Yawcam, YawcamMonitor, YawcamCam2Relay,
         FolderSyncRealTime). Any new value here is a persistence IOC. -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_USERS</windows_registry>

    <!-- Services + WMI subscription persistence (the suspected resident agent, T070) -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>

    <registry_ignore type="sregex">\Enum$</registry_ignore>
  </syscheck>

  <!-- ============================== ROOTCHECK ============================== -->
  <rootcheck>
    <disabled>no</disabled>
    <check_unixaudit>no</check_unixaudit>
    <windows_apps>./shared/win_applications_rcl.txt</windows_apps>
    <windows_malware>./shared/win_malware_rcl.txt</windows_malware>
  </rootcheck>

  <!-- ============================== LOG COLLECTION ============================== -->
  <!-- Windows Event Channels the ecosystem already audits, forwarded to the manager
       (off-box) so a local-admin attacker cannot erase them. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <!-- 4698-4702 task tamper, 4720/4732 account, 4946-4950/5025 firewall, 4663 SACL,
         4688 process creation, 4657 registry value change -->
    <query>Event/System[EventID=4698 or EventID=4699 or EventID=4700 or EventID=4701 or EventID=4702 or EventID=4663 or EventID=4657 or EventID=4688 or EventID=4720 or EventID=4732 or EventID=4946 or EventID=4947 or EventID=4948 or EventID=4950 or EventID=5025]</query>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <!-- Kernel-Power 42 (button/lid sleep sabotage), service control 7034/7040 -->
    <query>Event/System[EventID=42 or EventID=7034 or EventID=7040]</query>
  </localfile>

  <!-- Sysmon (T076) forwarded through Wazuh too, so the manager sees process/network/DNS -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- The ecosystem's own forensic logs -->
  <localfile>
    <location>C:\Sync\Logs\security\security_audit_*.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- ============================== ACTIVE RESPONSE ============================== -->
  <!-- Intentionally NO automated active-response on this endpoint. Under assume-breach
       the manager must observe and alert; remediation is driven from the off-host side
       (Velociraptor hunt + manual) to avoid an attacker weaponising the response. -->

</ossec_config>
